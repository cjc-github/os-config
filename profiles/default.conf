# ===========================================================================
# profiles/default.conf —— 默认开发环境（新装系统的推荐集合）
# ===========================================================================
# 用法：./setup.sh install --profile default
# ===========================================================================

[default]
desc=默认环境：最小集 + 归档/传输 + 代理 + Node + AI CLI + 日志
extends=minimal
tools=@archive, @transfer, proxy, nodejs, @ai, syslog, nosuspend
