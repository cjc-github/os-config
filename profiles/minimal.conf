# ===========================================================================
# profiles/minimal.conf —— 最小可用集合
# ===========================================================================
# 用法：./setup.sh install --profile minimal
#
# 配置格式（每个 [名字] 是一个 profile）：
#   extends = 继承的父 profile（可留空）
#   desc    = 一句话说明（--list 展示）
#   tools   = 工具列表（逗号分隔），支持：
#               curl            目录中的工具标识
#               @core           展开为 group=core 的全部工具
#               apt:htop        临时指定（不在目录中）的后端包
#
# 子 profile 的工具 = 父 profile 全部工具 + 自己列出的工具（并集）。
# ===========================================================================

[minimal]
desc=最小可用：镜像源 + 核心工具 + git/ssh
extends=
tools=mirrors, @core, git, ssh
