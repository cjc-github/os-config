# base-tools.conf —— sys-base 基础工具二维选择配置
#
# 第一维是分类：[core]、[archive]、[development] 等；
# 第二维是分类里的具体工具。只接受 true / false（不区分大小写）。
#
# 规则：
#   1. enabled=false 时跳过整个分类，分类内的工具值不会生效；
#   2. enabled=true 且工具=true 时，安装该工具映射的 APT 软件包；
#   3. 工具名及其 APT 软件包映射见：
#      platforms/ubuntu/modules/sys-base/packages.catalog
#   4. ./setup.sh --module base          按本文件安装缺少的软件；
#   5. ./setup.sh --module base --force  重新安装本文件选中的全部软件；
#   6. 可用 BASE_TOOLS_CONFIG=/path/to/file.conf 临时指定其他配置。

[core]
enabled=true
ca-certificates=true
curl=true
wget=true
gnupg=true

[file-transfer]
enabled=true
lrzsz=true
rsync=false

[archive]
enabled=true
zip=true
unzip=true
tar=true
gzip=true
bzip2=true
xz=true
sevenzip=true
rar=false

[development]
enabled=true
git=true
compiler=false
make=false
cmake=false
ninja=false
pkg-config=false
autoconf=false
automake=false
shellcheck=false

[network]
enabled=true
ping=true
dnsutils=false
net-tools=false
traceroute=false
tcpdump=false
telnet=false
aria2=false

[system]
enabled=false
htop=true
btop=false
tree=true
lsof=true
jq=true
tmux=false
gnu-screen=false
strace=false
file=true
ripgrep=false
fd=false

[editor]
enabled=false
vim=true
nano=false
