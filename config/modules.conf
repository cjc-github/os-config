# modules.conf —— 启用的模块清单
#
# 用途：不带参数运行 ./setup.sh 时，脚本会按本文件逐行读取模块名并执行。
# 每行一个模块名（使用各模块 module.conf 中的 NAME，不带目录分类前缀），
# # 开头或行尾的内容为注释，空行会被忽略。加哪行就尝试执行哪个模块。
#
# 常用操作：
#   ./setup.sh --list                 # 查看所有可用模块、依赖和说明
#   ./setup.sh --dry-run              # 按本文件查看执行计划，不实际安装
#   ./setup.sh                        # 按本文件执行
#   ./setup.sh --module nodejs,claude # 临时指定模块，不读取本文件中的模块清单
#   ./setup.sh --all                  # 执行全部已注册模块，忽略本文件的选择
#
# 模块依赖会自动补齐，并按依赖顺序执行。例如 claude 会自动先执行 nodejs、
# base 和 mirrors。mirrors 放最前面可使换源先于 base 的 apt 操作；base 的
# DEPS=mirrors 也会兜底。
mirrors
base
git
ssh
proxy
nodejs
log
screen
claude
codex
opencode
